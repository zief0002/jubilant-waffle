<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB Mixer</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff; 
            font-family: sans-serif;
            transition: background-color 0.4s ease;
        }
        .container {
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .color-box {
            width: 120px;
            height: 120px;
            margin: 20px auto;
            border: 3px solid #333;
            border-radius: 50%;
        }
        .rgb-inputs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        input[type="number"] {
            width: 60px;
            padding: 8px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
            text-align: center;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            border: none;
        }
        #updateBtn {
            background-color: #007bff;
            color: white;
        }
        #randomBtn {
            background-color: #f0f0f0;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>RGB Mixer</h1>
        <div class="color-box" id="colorBox"></div>
        <p><strong id="colorDisplay">rgb(255, 255, 255)</strong></p>

        <div class="rgb-inputs">
            <div class="input-group">
                <label>R</label>
                <input type="number" id="rVal" min="0" max="255" value="128">
            </div>
            <div class="input-group">
                <label>G</label>
                <input type="number" id="gVal" min="0" max="255" value="128">
            </div>
            <div class="input-group">
                <label>B</label>
                <input type="number" id="bVal" min="0" max="255" value="128">
            </div>
        </div>

        <div class="controls">
            <button id="updateBtn">Update Color from Inputs</button>
            <button id="randomBtn">Randomize Values</button>
        </div>
    </div>

    <script>
        // Use DOMContentLoaded to make sure the page is ready
        document.addEventListener('DOMContentLoaded', () => {
            const colorBox = document.getElementById('colorBox');
            const colorDisplay = document.getElementById('colorDisplay');
            const rIn = document.getElementById('rVal');
            const gIn = document.getElementById('gVal');
            const bIn = document.getElementById('bVal');
            const updateBtn = document.getElementById('updateBtn');
            const randomBtn = document.getElementById('randomBtn');

            function applyInputs() {
                // Ensure the value is a number and within 0-255
                const r = Math.min(255, Math.max(0, parseInt(rIn.value) || 0));
                const g = Math.min(255, Math.max(0, parseInt(gIn.value) || 0));
                const b = Math.min(255, Math.max(0, parseInt(bIn.value) || 0));

                const rgbString = `rgb(${r}, ${g}, ${b})`;
                
                document.body.style.backgroundColor = rgbString;
                colorBox.style.backgroundColor = rgbString;
                colorDisplay.textContent = rgbString;
                
                // Put the cleaned number back into the box in case the user typed something weird
                rIn.value = r;
                gIn.value = g;
                bIn.value = b;
            }

            function setRandomInputs() {
                rIn.value = Math.floor(Math.random() * 256);
                gIn.value = Math.floor(Math.random() * 256);
                bIn.value = Math.floor(Math.random() * 256);
                applyInputs();
            }

            // Bind the functions to the buttons
            updateBtn.addEventListener('click', applyInputs);
            randomBtn.addEventListener('click', setRandomInputs);

            // Run once on load
            applyInputs();
        });
    </script>
</body>
</html>
