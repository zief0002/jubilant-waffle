project:
  type: book
  output-dir: docs
  preview:
    port: 4200
    browser: true
  # resources: 
    # - codebooks/ #Add codebooks to docs

book:
  title: "Data Visualization: Summarizing and Communicating Patterns in Data"
  author: "Chelsey Legacy and Andrew Zieffler"
  date: "today"
  page-navigation: false
  bread-crumbs: false
  sidebar:
    search: true
    background: '#3F4C64'
  chapters:
    - index.qmd
    - part: "Computational Tools for Visualization"
      chapters:
        - 01-01-r-and-rstudio-installation.qmd
        - 01-02-introduction-to-rstudio.qmd
        - 01-03-r-packages.qmd
        - 01-04-script-files.qmd
        - 01-05-ggplot2.qmd
    - part: "Data"
      chapters:
        - 02-01-questions-to-ask-about-data.qmd
        - 02-02-importing-data.qmd
    - part: "Visualizing and Describing Quantitative Attributes"
      chapters:
        - 03-01-quantitative-distributions.qmd
        - 03-02-histograms-in-r.qmd
        - 03-03-labels.qmd
        - 03-04-computing-and-plotting-typical-values.qmd
        - 03-05-facetting.qmd
    - part: "Visualizing and Describing Categorical Attributes"
      chapters:
        - 04-01-categorical-distributions.qmd
        - 04-02-bar-charts-in-r.qmd
        - 04-03-color.qmd
        - 04-04-conditioning.qmd
        - 04-05-scales.qmd
        - 04-06-bar-charts-from-summaries.qmd
    - part: "Visualizing and Describing Quantitative Relationships"
      chapters:
        - 05-01-quantitative-relationships.qmd
        - 05-02-scatterplots-in-r.qmd
        - 05-03-themes.qmd
        - 05-04-conditioning-relationships.qmd
        - 05-05-color-palettes.qmd
        - 05-06-annotations.qmd
    - part: "Visualizations to Address Change Over Time"
      chapters:
        - 06-01-temporal-visualizations.qmd
        - 06-02-line-graphs-in-r.qmd
    - part: "Visualizations to Address Spatial Relationships"
      chapters:
        - 07-01-spatial-visualizations.qmd
        - 07-02-maps-with-points-in-r.qmd
        - 07-03-simple-features.qmd
        - 07-05-shapefiles.qmd
        - 07-04-choropleth-map.qmd

lightbox: "auto"
bibliography: ["assets/epsy-1261.bib"]
csl: 'assets/apa.csl'
include-in-header: 'assets/epsy-1261.js'

format:
  html:
    axe: true
    theme: 
      - cosmo
      - "assets/theme.scss"
    css: ["assets/sticky-notes.css", "assets/table-styles.css"]
    header-includes: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    code-copy: true
    # code-tools:
    #   source: true
    #   toggle: true
    #   caption: "Quarto Code"
    highlight-style: "a11y-dark"
    # df-print: paged
    mainfont: 'Atkinson Hyperlegible'
    fontsize: '13pt'
    linestretch: '1.5em'
    linkcolor: '#c10088'
    toc: false
    toc-title: "On This Page"
editor: source
